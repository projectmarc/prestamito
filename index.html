<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Préstamos PWA</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="header">
        <h1>Calculadora de Préstamos</h1>
    </header>

    <main class="container">
        <section class="calculator-inputs">
            <div class="input-group">
                <label for="capital">Capital a otorgar ($)</label>
                <input type="number" id="capital" placeholder="Ej: 100000" min="1" step="1">
            </div>

            <div class="input-group">
                <label for="rate">Tasa de interés mensual (%)</label>
                <input type="number" id="rate" value="22" step="any">
            </div>
        </section>

        <section class="calculator-results" aria-live="polite">
            <div id="results-grid" class="results-grid">
                <div class="empty-state">Ingresa un capital para ver las opciones.</div>
            </div>
        </section>
    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
